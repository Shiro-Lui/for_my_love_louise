<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR untuk Loise</title>
    <style>
      :root {
        --bg: #070b18;
        --panel: rgba(14, 15, 28, 0.8);
        --pink: #ff72c4;
        --red: #ff4d7a;
        --white: #fffafc;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(255, 112, 196, 0.22), transparent 30%),
          linear-gradient(180deg, #080d1a, #040712 42%, #02050c 100%);
        color: var(--white);
        font-family: 'Inter', sans-serif;
      }

      .qr-screen {
        width: min(90vw, 460px);
        padding: 24px 18px 30px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 28px;
        background: rgba(20, 21, 36, 0.8);
        box-shadow: 0 0 24px rgba(255, 90, 168, 0.18), 0 0 50px rgba(156, 99, 255, 0.1);
        text-align: center;
      }

      .qr-heart-frame {
        width: min(72vw, 300px);
        aspect-ratio: 1;
        margin: 0 auto 18px;
        padding: 18px;
        border-radius: 28px;
        background: linear-gradient(135deg, rgba(255, 107, 190, 0.22), rgba(255, 210, 235, 0.12));
        box-shadow: inset 0 0 0 3px rgba(255, 126, 197, 0.4), 0 0 20px rgba(255, 126, 197, 0.25);
      }

      .qr-heart-frame img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        border-radius: 24px;
        background: #fff;
      }

      h1 {
        font-size: clamp(1.8rem, 4vw, 2.4rem);
        margin: 0 0 12px;
        color: #ff9ddf;
        text-shadow: 0 0 18px rgba(255, 145, 205, 0.8);
      }

      p {
        margin: 0;
        line-height: 1.7;
        color: rgba(255, 255, 255, 0.82);
      }

      .link { margin-top: 16px; }
      a {
        color: #ffb7dc;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="qr-screen">
      <div class="qr-heart-frame">
        <img src="/loise-qr.png" alt="QR code untuk membuka website untuk Loise" />
      </div>
      <h1>Scan aku, Loise ❤️</h1>
      <p>Ada sesuatu yang ingin aku sampaikan kepadamu.</p>
      <p class="link"><a href="/">Kembali ke website</a></p>
    </main>
  </body>
</html>
